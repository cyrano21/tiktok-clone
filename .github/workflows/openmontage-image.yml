name: OpenMontage executor image

on:
  pull_request:
    branches: [main]
    paths:
      - 'services/openmontage-executor/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/openmontage-image.yml'
  push:
    branches: [main]
    paths:
      - 'services/openmontage-executor/**'
      - 'docker-compose.prod.yml'
      - '.github/workflows/openmontage-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orky-openmontage-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build pinned OpenMontage executor image
        run: >-
          docker build
          --tag orky-openmontage-executor:ci
          services/openmontage-executor

      - name: Verify bundled runtimes
        run: |
          docker run --rm --entrypoint /bin/sh orky-openmontage-executor:ci -lc '
            set -eu
            python3 --version
            ffmpeg -version | head -1
            test "$(codex --version)" = "codex-cli 0.148.0"
            test -x /usr/local/bin/codex
            test -e /usr/local/bin/codex-real
            test "$(cd /opt/openmontage && git rev-parse HEAD)" = "1bab711820828c2e5fc1f87ed274a32587cb048f"
            test -f /opt/openmontage/AGENT_GUIDE.md
            test -f /opt/openmontage/remotion-composer/package.json
          '

      - name: Smoke-test executor health endpoint
        run: |
          set -eu
          container_id="$(docker run -d --rm \
            -e OPENMONTAGE_EXECUTOR_TOKEN=ci-executor-secret \
            -p 127.0.0.1:8787:8787 \
            orky-openmontage-executor:ci)"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/health | grep -q '"ok": true'; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_id" || true
          exit 1
