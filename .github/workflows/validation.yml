name: Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orky-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install web dependencies
        run: npm ci --legacy-peer-deps

      - name: Compile OpenMontage executor
        run: python -m py_compile services/openmontage-executor/server.py

      - name: OpenMontage contract tests
        run: npm test -- --runInBand __tests__/openMontagePlan.test.ts __tests__/openMontageExecutionContract.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:4000
          NEXT_PUBLIC_SCRAPER_API_URL: /api/scraper
          NEXT_PUBLIC_ORCHIDY_BASE_URL: https://orchidy.fr
          NEXT_PUBLIC_USE_DEMO: 'false'
          NEXT_PUBLIC_USE_SCRAPER_FEED: 'false'
