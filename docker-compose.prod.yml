services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [orky]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [orky]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    command: server /data --console-address ':9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [orky]

  minio-init:
    image: minio/mc:latest
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} && mc mb local/$${S3_BUCKET} --ignore-existing && mc anonymous set none local/$${S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
    networks: [orky]

  livekit:
    image: livekit/livekit-server:v1.13.4
    restart: unless-stopped
    command: --config /etc/livekit.yaml --bind 0.0.0.0
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
    volumes:
      - ./livekit.prod.yaml:/etc/livekit.yaml:ro
    ports:
      - '7881:7881/tcp'
      - '7882:7882/udp'
    networks: [orky]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/$${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: 'true'
      CDN_URL: ${CDN_URL:?CDN_URL is required}
      LIVEKIT_URL: ${LIVEKIT_URL:?LIVEKIT_URL is required}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY is required}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET is required}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:?STRIPE_PRICE_PRO is required}
      STRIPE_PRICE_BUSINESS: ${STRIPE_PRICE_BUSINESS:?STRIPE_PRICE_BUSINESS is required}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      TIKTOK_REDIRECT_URI: ${TIKTOK_REDIRECT_URI:-}
      TIKTOK_FRONTEND_RETURN_URL: ${TIKTOK_FRONTEND_RETURN_URL:-}
      TIKTOK_TOKEN_ENCRYPTION_KEY: ${TIKTOK_TOKEN_ENCRYPTION_KEY:?TIKTOK_TOKEN_ENCRYPTION_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      livekit:
        condition: service_started
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/health']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [orky]

  scraper-api:
    build:
      context: ./scraper-api
      dockerfile: Dockerfile.scraper
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      APIFY_TOKEN: ${APIFY_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      VIDEO_CACHE_DIR: /app/data/video_cache
      SCRAPER_INTERNAL_SECRET: ${SCRAPER_INTERNAL_SECRET:?SCRAPER_INTERNAL_SECRET is required}
      SCRAPER_DATA_DIR: /app/data
      SCRAPER_AUTO_REFRESH: ${SCRAPER_AUTO_REFRESH:-0}
      SCRAPER_AUTO_REFRESH_HOUR: ${SCRAPER_AUTO_REFRESH_HOUR:-3}
      SCRAPER_REFRESH_COMMENTS: ${SCRAPER_REFRESH_COMMENTS:-6}
      SCRAPER_REFRESH_PER: ${SCRAPER_REFRESH_PER:-10}
      SCRAPER_REFRESH_WORKERS: ${SCRAPER_REFRESH_WORKERS:-4}
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8502/api/health']
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - scraper_data:/app/data
    networks: [orky]

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL is required}
        NEXT_PUBLIC_SCRAPER_URL: ${NEXT_PUBLIC_SCRAPER_URL:-}
        NEXT_PUBLIC_SCRAPER_API_URL: ${NEXT_PUBLIC_SCRAPER_API_URL:-/api/scraper}
        NEXT_PUBLIC_ORCHIDY_BASE_URL: ${NEXT_PUBLIC_ORCHIDY_BASE_URL:-https://orchidy.fr}
        NEXT_PUBLIC_USE_DEMO: ${NEXT_PUBLIC_USE_DEMO:-false}
        NEXT_PUBLIC_USE_SCRAPER_FEED: ${NEXT_PUBLIC_USE_SCRAPER_FEED:-false}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL is required}
      NEXT_PUBLIC_SCRAPER_URL: ${NEXT_PUBLIC_SCRAPER_URL:-}
      NEXT_PUBLIC_SCRAPER_API_URL: ${NEXT_PUBLIC_SCRAPER_API_URL:-/api/scraper}
      NEXT_PUBLIC_ORCHIDY_BASE_URL: ${NEXT_PUBLIC_ORCHIDY_BASE_URL:-https://orchidy.fr}
      NEXT_PUBLIC_USE_DEMO: ${NEXT_PUBLIC_USE_DEMO:-false}
      NEXT_PUBLIC_USE_SCRAPER_FEED: ${NEXT_PUBLIC_USE_SCRAPER_FEED:-false}
      ORCHIDY_API_BASE_URL: ${ORCHIDY_API_BASE_URL:-https://orchidy.fr}
      ORKY_CHECKOUT_HANDOFF_SECRET: ${ORKY_CHECKOUT_HANDOFF_SECRET:?ORKY_CHECKOUT_HANDOFF_SECRET is required}
      SCRAPER_API_INTERNAL_URL: http://scraper-api:8502
      SCRAPER_INTERNAL_SECRET: ${SCRAPER_INTERNAL_SECRET:?SCRAPER_INTERNAL_SECRET is required}
      ORCHIDY_PRO_API_URL: ${ORCHIDY_PRO_API_URL:?ORCHIDY_PRO_API_URL is required}
      ORCHIDY_PRO_API_KEY: ${ORCHIDY_PRO_API_KEY:?ORCHIDY_PRO_API_KEY is required}
      # Shared only with Orchidy Pro. It authenticates the delegated ORKY user
      # identity carried beside the machine x-api-key; never expose as NEXT_PUBLIC_*.
      ORKY_PRO_DELEGATION_SECRET: ${ORKY_PRO_DELEGATION_SECRET:?ORKY_PRO_DELEGATION_SECRET is required}
    depends_on:
      api:
        condition: service_healthy
      scraper-api:
        condition: service_healthy
    networks: [orky]

volumes:
  scraper_data:
  postgres_data:
  redis_data:
  minio_data:

networks:
  orky:
    driver: bridge
