version: '3.8'

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tiktok-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tiktok}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tiktok_secret_2024}
      POSTGRES_DB: ${POSTGRES_DB:-tiktok_clone}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tiktok} -d ${POSTGRES_DB:-tiktok_clone}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tiktok-net

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: tiktok-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tiktok-net

  # ── Backend API (Fastify) ──────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tiktok-api
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-tiktok}:${POSTGRES_PASSWORD:-tiktok_secret_2024}@postgres:5432/${POSTGRES_DB:-tiktok_clone}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_2024_change_me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super_secret_refresh_key_2024_change_me}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/health']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tiktok-net

  # ── Frontend (Next.js) ─────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: tiktok-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - tiktok-net

volumes:
  postgres_data:
  redis_data:

networks:
  tiktok-net:
    driver: bridge
