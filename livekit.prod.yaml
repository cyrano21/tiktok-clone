port: 7880
bind_addresses:
  - 0.0.0.0
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: true
room:
  empty_timeout: 30
  departure_timeout: 10
webhook:
  api_key: ${LIVEKIT_API_KEY}
  urls:
    - http://api:4000/v1/live/webhook
# Clés serveur LiveKit : LiveKit exige que les clés utilisées pour signer les
# tokens ET les webhooks soient déclarées ici (format "secret: key").
# Les valeurs sont injectées par Coolify — jamais commitées.
keys:
  ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
