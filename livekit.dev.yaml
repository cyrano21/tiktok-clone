# Local-only LiveKit configuration used by docker-compose.yml.
# Production must replace these development credentials and expose LiveKit over
# HTTPS/WSS with the required TCP/UDP media ports.
port: 7880

rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false

keys:
  devkey: secret

room:
  empty_timeout: 30
  departure_timeout: 10

webhook:
  api_key: devkey
  urls:
    - http://api:4000/v1/live/webhook
